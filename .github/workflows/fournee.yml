# Met à jour la page d'accueil depuis la fournée « Current » de Notion.
# Lancé par Make (fournée « Ready », puis le lendemain du retrait),
# une fois par jour en secours, ou à la main (Actions → Run workflow).
# Si quelque chose change, enregistre les fichiers puis relance « Publier le site »
# (un enregistrement fait par une Action ne relance pas les autres Actions tout seul).
name: Fournée depuis Notion

on:
  repository_dispatch:
    types: [fournee]
  workflow_dispatch:
    inputs:
      verifier:
        description: "Vérifier seulement (lire Notion, ne rien changer)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *" # 5h17 en hiver, 6h17 en été (heure suisse)

permissions:
  contents: write
  actions: write

concurrency:
  group: fournee
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire Notion et écrire les fichiers
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_fournee.py ${{ inputs.verifier && '--verifier' || '' }}

      - name: Enregistrer et publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain _data)" ]; then
            echo "Rien à changer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/fournee.yml _data/fournees
          git commit -m "Fournée : mise à jour depuis Notion"
          git push
          gh workflow run publier.yml --ref main
