<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <ul class="nav-links">
      {% assign liens = "Home|/,Commandes|/commandes/,Histoire|/histoire/,Galerie|/galerie/,Contact|/contact/" | split: "," %}
      {% for l in liens %}{% assign p = l | split: "|" %}
      <li><a href="{{ p[1] | relative_url }}"{% if page.url == p[1] %} aria-current="page"{% endif %}>{{ p[0] }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  {{ content }}
  <footer class="footer">© {{ site.time | date: "%Y" }} {{ site.title }}</footer>
</body>
</html>
